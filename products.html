<!doctype html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>獎勵道具</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif; color: #f8eff5; background: #100d14; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1160px; margin: auto; padding: 30px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0; color: #dda4c0; font-size: 12px; letter-spacing: 2px; }
    h1 { margin: 10px 0; font-size: clamp(26px, 5vw, 34px); }
    .intro, .note { color: #b9acbc; line-height: 1.75; font-size: 13px; margin: 0; }
    .products { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    figure { display: flex; flex-direction: column; margin: 0; border: 1px solid #422c3d; border-radius: 15px; background: linear-gradient(145deg, #211522, #15121c); padding: 20px 16px; text-align: center; }
    .portrait { height: 230px; display: grid; place-items: center; }
    .portrait img { width: 220px; height: 220px; max-width: 100%; object-fit: contain; }
    figcaption { margin: 10px 0 14px; font-size: 21px; font-weight: 600; }
    .effect { margin: 0 0 8px; font-size: 13px; color: #c4b0c4; }
    .effect b { display: block; margin-top: 5px; color: #ffe2f0; font-size: 17px; font-weight: 600; }
    .details { flex: 1; margin: 0 0 22px; color: #c4b0c4; font-size: 14px; line-height: 1.75; }
    .product-link { display: grid; place-items: center; min-height: 44px; padding: 10px 8px; border: 1px solid #422c3d; border-radius: 8px; color: #f8eff5; background: #111216; font-size: 14px; line-height: 1.5; text-decoration: none; }
    .product-link:focus { color: #17140c; background: #e8be50; border-color: #e8be50; }
    .product-link:focus-visible { outline: 2px solid #e8be50; outline-offset: 4px; }
    @media(max-width: 900px) { .products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media(max-width: 420px) { main { padding: 24px 12px; } .products { gap: 10px; } figure { padding: 14px 10px; } .portrait { height: 160px; } .portrait img { width: 150px; height: 150px; } .product-link { font-size: 12px; } .details { font-size: 13px; } .eyebrow { font-size: 10px; letter-spacing: 1px; } }
  </style>
  <script defer src="js/control-selection.js"></script>
</head>

</html>
