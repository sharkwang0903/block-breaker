<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%233989D4' d='M2 5h12v9H2z'/%3E%3Cpath fill='%23E8BE50' d='M18 5h12v9H18z'/%3E%3Cpath fill='%23D85B59' d='M2 18h12v9H2z'/%3E%3Cpath fill='%2342A987' d='M18 18h12v9H18z'/%3E%3C/svg%3E">
  <title>水母打磚塊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="home" class="home" aria-labelledby="home-title">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="eyebrow">A LITTLE BREAK. A LOT OF BRICKS.</p>
      <h1 id="home-title" aria-label="水母打磚塊">水母<br><span>打磚塊</span></h1>
      <p class="intro">接住每一次反彈，打開下一個可能。<br>和 Pink 一起挑戰，商品道具助你破關。</p>
      <div class="mode-buttons">
        <button id="normal-mode" class="mode primary"><span>正常模式<small>10 個關卡，逐一擊破</small></span><span aria-hidden="true">↗</span></button>
        <button id="infinite-mode" class="mode"><span>無限模式<small>持續挑戰，直到最後一球</small></span><span aria-hidden="true">∞</span></button>
      </div>
      <p class="home-controls"><kbd>←</kbd><kbd>→</kbd> 移動 <span>／</span> <kbd>Space</kbd> 發球・滿能量大招<br><span class="touch-hint">手機：拖曳移動，點按發球或水母電擊</span></p>
      <div class="home-footer"><span>CANVAS ARCADE</span><span>01 — FIRST EDITION</span></div>
    </section>

    <section id="game-screen" class="game-screen" hidden aria-label="遊戲">
      <header class="game-header">
        <div class="wordmark">水母打磚塊<span id="mode-label">正常模式</span></div>
        <button id="pause-button" class="icon-button" aria-label="暫停遊戲" title="暫停（Esc）">Ⅱ</button>
      </header>
      <div class="hud" aria-live="off">
        <div><span class="hud-label">關卡</span><strong id="level-value">01 <small>/ 10</small></strong></div>
        <div class="score-cell"><span class="hud-label">分數</span><strong id="score-value">000000</strong></div>
        <div class="lives-cell"><span class="hud-label">生命</span><strong id="lives-value" aria-label="3 條生命">● ● ●</strong></div>
      </div>
      <div class="play-layout">
      <div id="board-wrap" class="board-wrap">
        <canvas id="game-canvas" width="480" height="640" tabindex="0" aria-label="水母打磚塊遊戲區。方向鍵移動、空白鍵發球或滿能量時發動水母電擊、Esc 暫停；觸控拖曳移動。"></canvas>
        <div id="pickup-toast" class="pickup-toast" hidden aria-hidden="true"><span id="pickup-text"></span></div>
        <div id="overlay" class="overlay" hidden>
          <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
            <p id="dialog-tag" class="eyebrow">TAKE A BREATH</p>
            <h2 id="dialog-title">遊戲暫停</h2>
            <p id="dialog-description"></p>
            <dl id="result-stats" class="result-stats" hidden></dl>
            <div id="dialog-actions" class="dialog-actions"></div>
            <a id="result-product-link" class="result-product-link primary" href="products.html" target="_blank" rel="noopener noreferrer" title="另開分頁查看商品與遊戲效果" hidden>了解這些獎勵道具</a>
          </div>
        </div>
      </div>
      <aside id="companion" class="companion" data-mood="idle" aria-label="Pink 水母應援區">
        <div class="companion-heading"><span class="companion-dot" aria-hidden="true"></span>應援夥伴 <strong>PINK</strong></div>
        <div class="companion-stage" aria-hidden="true">
          <div class="companion-halo"></div>
          <div class="companion-float"><img id="companion-image" class="companion-image" src="assets/pink/pink-idle.png" alt="" width="1024" height="1024" draggable="false"></div>
          <span class="companion-spark spark-one">✦</span><span class="companion-spark spark-two">✦</span>
        </div>
        <div class="companion-copy"><p id="companion-message" class="companion-message">準備好了嗎？一起加油！</p><p class="companion-caption">每一次反彈，都陪著你。</p></div>
        <div class="ultimate-panel">
          <div class="energy-heading"><span class="energy-label">水母能量</span><strong id="energy-value">0 / 25</strong></div>
          <div id="energy-meter" class="energy-meter" role="progressbar" aria-label="水母大招能量" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"><span id="energy-fill" class="energy-fill"></span></div>
          <p id="ultimate-status" class="ultimate-status">回擊＋1・商品＋5</p>
          <button id="ultimate-button" class="ultimate-button" disabled><span>水母電擊</span><small class="ultimate-key">SPACE</small></button>
        </div>
      </aside>
      </div>
      <footer class="game-footer">
        <div id="effects" class="effects" aria-label="生效中的道具"><span>準備好下一次反彈</span></div>
        <button id="launch-button" class="launch-button">發球 <span>SPACE ↗</span></button>
      </footer>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>
  <!-- Classic scripts support both file:// and HTTP. Keep dependency order. -->
  <script defer src="js/control-selection.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/levels.js"></script>
  <script defer src="js/powerups.js"></script>
  <script defer src="js/bricks.js"></script>
  <script defer src="js/physics.js"></script>
  <script defer src="js/ultimate.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/input.js"></script>
  <script defer src="js/companion.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
